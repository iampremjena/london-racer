<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>London Street Racer 3D</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
    #canvas-container { width: 100vw; height: 100vh; }
    #menu-overlay {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle at center, rgba(15,20,35,0.85) 0%, rgba(5,7,12,0.98) 100%);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 100; color: #fff; text-align: center;
    }
    #menu-overlay h1 { font-size: 3.5rem; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 10px; color: #ff3333; text-shadow: 0 0 15px rgba(255,51,51,0.6); }
    #menu-overlay p { font-size: 1.2rem; color: #aaa; margin-bottom: 30px; }
    .start-btn {
      padding: 16px 48px; font-size: 1.4rem; font-weight: bold; color: #fff;
      background: linear-gradient(135deg, #e60000 0%, #990000 100%);
      border: none; border-radius: 40px; cursor: pointer;
      box-shadow: 0 0 20px rgba(230,0,0,0.5); transition: transform 0.2s;
    }
    .start-btn:hover { transform: scale(1.05); }
    #hud {
      position: absolute; top: 20px; left: 20px; color: #fff; z-index: 10;
      display: none; text-shadow: 2px 2px 4px #000; font-size: 1.8rem; font-weight: bold; color: #00ffcc;
    }
  </style>
</head>
<body>
  <div id="menu-overlay">
    <h1>London Street Race</h1>
    <p>Controls: WASD / Arrow Keys to Drive | Space for Handbrake</p>
    <button class="start-btn" id="start-btn">START STREET RACE</button>
  </div>
  <div id="hud">
    <div id="speedometer">0 KM/H</div>
  </div>
  <div id="canvas-container"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
