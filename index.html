<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>London Racer 3D</title>

  <!-- Import map allows native browser ES module imports for Three.js -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <style>
    body { margin: 0; overflow: hidden; background: #0a0c12; font-family: sans-serif; }
    #canvas-container { width: 100vw; height: 100vh; }
    #ui {
      position: absolute; top: 20px; left: 20px; color: #fff;
      text-shadow: 1px 1px 3px #000; pointer-events: none; z-index: 10;
    }
  </style>
</head>
<body>
  <div id="ui">
    <h1>London Racer 3D</h1>
    <p>Controls: <strong>WASD</strong> / Arrows to drive, <strong>Space</strong> to handbrake</p>
  </div>
  <div id="canvas-container"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
